# 로컬 개발용 PostgreSQL. 접속 정보는 .env.example의 DATABASE_URL과 맞춰 둔다.
#   docker compose up -d      # 시작
#   docker compose down       # 중지 (데이터는 볼륨에 남음)
#   docker compose down -v    # 중지 + 데이터 삭제
services:
  db:
    # PostgreSQL 17 + pgvector (약관 검색, C-075). postgres:17-trixie와 같은 PG 빌드·Debian(trixie) 기반이라
    # 기존 볼륨을 그대로 쓴다 (정렬 규칙(glibc)이 같다). 볼륨을 지우지 않고 이미지만 바꿔 다시 띄우면 된다.
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_USER: postgres
      # .env의 POSTGRES_PASSWORD를 쓴다 (DATABASE_URL의 비밀번호와 같아야 한다). 처음 볼륨을 만들 때만 적용된다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 넣어 주세요 (.env.example 참고)}
      POSTGRES_DB: avengers_bank
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avengers_bank"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  db-data:
