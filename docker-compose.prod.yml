# 운영(시연) 배포용: API + 화면(web) + Caddy(HTTPS). DB는 이 파일에 없다 (RDS 등 DATABASE_URL로 연결).
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api alembic upgrade head
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api python -m avengers_bank.seed
services:
  api:
    build: .
    env_file: .env.prod
    restart: unless-stopped
    # ports를 열지 않는다: 같은 네트워크의 caddy만 접근한다 (uvicorn의 --forwarded-allow-ips '*' 전제)
    expose:
      - "8000"

  # 화면(Next.js). 브라우저의 /api/...는 Caddy가 API로 보내므로 API 주소를 알 필요가 없다 (deploy/Caddyfile)
  web:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?.env.prod에 DOMAIN을 넣어 주세요 (.env.prod.example 참고)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data  # 받은 인증서. 지우면 재발급(발급 횟수 제한에 걸릴 수 있음)
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
